[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "exodynamics"
version = "0.2.0"
description = "Reproducible reconstruction and analysis of observed multi-planet systems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Biswajit Jana" }]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=17,<24",
  "scipy>=1.14,<2",
  "astropy>=7,<9",
  "matplotlib>=3.9,<4",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dynamics = ["rebound>=4.4,<5"]
observations = ["astroquery>=0.4.10,<1", "lightkurve>=2.5,<3"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.17,<2", "pandas-stubs>=2.2"]

[project.scripts]
exodynamics = "exodynamics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exodynamics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
follow_imports = "skip"
warn_return_any = false

[[tool.mypy.overrides]]
module = ["rebound", "rebound.*"]
ignore_missing_imports = true
